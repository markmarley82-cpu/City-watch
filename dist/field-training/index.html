  // Fight sounds from what actually happened: the new lines of the incident log, in order.
  function fightSounds(before,after){
    let A=null;try{A=parent.CWTeamAudio||window.CWTeamAudio;}catch{}
    if(!A)return;if(!A.sequence){if(after.actors.some(a=>a.hp<(before.actors.find(b=>b.id===a.id)?.hp??a.hp)))A.cue('hit');return;}
    const old=before.log||[],now=after.log||[];let fresh;
    if(old.length<80)fresh=now.slice(old.length);
    else{let o=0;while(o<old.length&&!old.slice(o).every((t,i)=>now[i]===t))o++;fresh=now.slice(old.length-o);}
    const seq=[],add=(id,gap=280)=>seq.push(seq.length?[id,gap]:id);let m;
    for(const t of fresh.slice(-12)){
      if((m=/ uses (.+?) against (.+): (\d+) stamina/.exec(t))){
        const w=m[1],d=Number(m[3]);
        if(/crossbow/i.test(w)){add('fight-crossbow');if(d)add('fight-bolt',170);}
        else if(!d)add('fight-block');
        else add(/sword|blade/i.test(w)?'fight-blade':/empty-hand/i.test(w)?'fight-punch':'fight-club');
        if(d)add(/troll/i.test(m[2])?'voice-troll':'voice-suspect',90);
      }
      else if(/ casts a dazzling burst at /.test(t)){add('fight-spell');add('voice-officer',500);}
      else if(/ swings at .*\((guarded|defended)\)/.test(t)){add('fight-block');add('fight-heavy',110);}
      else if(/ swings at /.test(t)){add('fight-heavy');add('voice-officer',90);}
      else if(/ swings into empty space/.test(t))add('fight-swish');
      else if(/ throws pocket grit/.test(t))add('fight-grit');
      else if(/ strikes( again at)? .*: \d+ stamina \((guarded|defended)\)/.test(t)){add('fight-block');add('fight-punch',110);}
      else if(/ strikes( again at)? .*: \d+ stamina/.test(t)){add('fight-punch');add('voice-officer',90);}
      else if(/ is incapacitated\.| cannot continue\./.test(t)){add('voice-down',200);add('fight-fall',260);}
      else if(/ shoves /.test(t))add('fight-shove');
      else if(/ restrains /.test(t))add('arrest');
      else if(/ braces[. ]/.test(t))add('fight-guard');
      else if(/ uses a bandage/.test(t))add('fight-bandage');
    }
    if(seq.length)A.sequence(seq);

    body:not(.cw-simple) .cw-hpbox,body:not(.cw-simple) #cw-sb{display:none!important}`;
   document.head.append(simpleCSS);
   const sb=document.createElement('section');sb.id='cw-sb';sb.innerHTML='<div class="msg" aria-live="polite"></div><button data-c="fight">⚔<span>Fight<small>Truncheon</small></span></button><button data-c="talk">💬<span>Talk<small>Wear down their nerve</small></span></button><button data-c="arrest">⛓<span>Arrest<small>When they give up</small></span></button><button data-c="item">🩹<span>Bandage<small></small></span></button><div class="row"><span class="who"></span><a role="button" tabindex="0" data-full>Full controls</a></div>';
   (document.querySelector('section.sheet')||document.body).prepend(sb);
   const foeBox=document.createElement('div');foeBox.className='cw-hpbox';foeBox.style.cssText='top:calc(env(safe-area-inset-top,0px) + 8px);left:8px';document.body.append(foeBox);
   const meBox=document.createElement('div');meBox.className='cw-hpbox';meBox.style.cssText='';sb.querySelector('.msg').after(meBox);meBox.className='cw-mebar';

   function liveFoes(){return state.actors.filter(f=>f.team==='opposition'&&!['released','escaped','arrested','incapacitated'].includes(f.status));}
   function pick(a){const foes=liveFoes();return foes.find(x=>x.id===target)||foes.sort((x,y)=>C.distance(a,x)-C.distance(a,y))[0];}
   const wait=ms=>new Promise(r=>setTimeout(r,ms));
   // Step beside the target if needed, then do the action, then end the turn.
   async function command(type,a,f){
    if(busy)return;busy=true;try{
     target=f.id;
     if(C.availability(state,type,f.id)&&C.distance(a,f)>1&&(state.budget?.move||0)>=1){const plan=C.approach(state,f.id);if(plan.ok){perform(()=>C.move(state,plan.to.x,plan.to.y),false,{type:'move'});await wait(650);}}
     if(state.phase==='battle'&&!C.availability(state,type,f.id)){perform(()=>C.act(state,type,f.id),true,{type,target:f.id});await wait(900);}

     if(state.phase==='battle'&&state.actors[state.turn]===a)$('end-turn').click();
    }finally{busy=false;}
   }
   async function partnerTurn(a){
    if(busy)return;busy=true;try{await wait(700);const f=pick(a);
     if(f){const type=!C.availability(state,'restrain',f.id)?'restrain':'strike';if(C.availability(state,type,f.id)&&C.distance(a,f)>1&&(state.budget?.move||0)>=1){const plan=C.approach(state,f.id);if(plan.ok){perform(()=>C.move(state,plan.to.x,plan.to.y),false,{type:'move'});await wait(600);}}
      if(state.phase==='battle'&&!C.availability(state,type,f.id)){perform(()=>C.act(state,type,f.id),true,{type,target:f.id});await wait(900);}}
     if(state.phase==='battle'&&state.actors[state.turn]===a)$('end-turn').click();
    }finally{busy=false;}
   }
   for(const c of ['fight','talk','arrest','item'])btn(c).addEventListener('click',()=>{const a=state.actors[state.turn];if(!a||a.team!=='watch')return;const f=pick(a);if(!f&&c!=='item')return;
    command({fight:'strike',talk:'talk',arrest:'restrain',item:'item'}[c],a,c==='item'?(f||a):f);});
   setInterval(()=>{try{
    const on=simpleOn&&campaignMode&&state&&state.phase==='battle'&&state.mode!=='classic';document.body.classList.toggle('cw-simple',!!on);if(!on)return;
    const a=state.actors[state.turn],officer=state.actors.find(x=>x.id==='officer'),partner=state.actors.find(x=>x.team==='watch'&&x.id!=='officer');
    const foes=liveFoes();
    foeBox.innerHTML=foes.slice(0,2).map(f=>'<div>'+f.name+'<div class="bar"><i style="width:'+pct(f.hp,f.maxHp)+'"></i></div><small><span>Stamina '+f.hp+'/'+f.maxHp+'</span><span>Nerve '+(f.morale??'–')+'</span></small><div class="bar r"><i style="width:'+pct(f.morale??0,f.maxMorale??f.resolve??8)+'"></i></div></div>').join('<hr style="border:0;border-top:1px solid #b9a37a;margin:6px 0">')||'<div>All dealt with</div>';
    meBox.innerHTML=officer?'<span>'+officer.name+'</span><div class="bar"><i style="width:'+pct(officer.hp,officer.maxHp)+'"></i></div><small>'+officer.hp+'/'+officer.maxHp+(partner?' · '+partner.name+' '+partner.hp+'/'+partner.maxHp:'')+'</small>':'';
    const mine=a&&a.id==='officer',f=a&&a.team==='watch'?pick(a):null,last=(state.log||[]).slice(-1)[0]||'';
    msg.textContent=mine&&!busy?'What will '+a.name+' do?'+(f?' ('+nmS(f.name)+' '+(C.distance(a,f)>1?'is a few steps away':'is right in front of you')+')':''):last;
    for(const c of ['fight','talk','arrest','item']){const type={fight:'strike',talk:'talk',arrest:'restrain',item:'item'}[c];let ok=mine&&!busy&&!!f;
     if(ok){const r=C.availability(state,type,c==='item'?a.id:f.id);ok=!r||C.distance(a,f)>1&&/beside|reach|adjacent|range/i.test(r)&&(state.budget?.move||0)>=1&&['strike','talk'].includes(type);}
     btn(c).disabled=!ok;}
    btn('item').querySelector('small').textContent=(state.items??0)+' left';
    sb.querySelector('.who').textContent=a?(a.team==='watch'?a.name+'’s turn':'Their turn'):'';
    if(a&&a.team==='watch'&&a.id!=='officer'&&!busy)partnerTurn(a);
   }catch(e){}},250);
   let autoEndKey='';setInterval(()=>{try{if(!state||state.phase!=='battle'||state.mode==='classic')return;const a=state.actors?.[state.turn];if(!a||a.team!=='watch')return;if((state.budget?.move||0)>=1||(state.budget?.action||0)>=1){autoEndKey='';return;}const k=state.round+':'+state.turn;if(autoEndKey===k)return;autoEndKey=k;setTimeout(()=>{const b=state.actors?.[state.turn];if(state.phase==='battle'&&b===a&&(state.budget?.move||0)<1&&(state.budget?.action||0)<1){showReport?.({summary:a.name+'’s turn is over',detail:'The other side moves now.',tone:'info'});$('end-turn').click();}},900);}catch{}},400);
  $('next-case').addEventListener('click',()=>restart(state.mode,P.next(state)));
  $('replay').addEventListener('click',()=>restart());
  $('return').addEventListener('click',()=>{if(campaignMode){if(state.result)parent.postMessage({type:'cw-p21-battle-result',encounterId:campaignContext?.pending.id,battle:C.clone(state)},location.origin);return;}C.claimResult(state);state.phase='patrol';showMoves=false;error='';render();$('replay').focus({preventScroll:true});});
  $('notebook-open').addEventListener('click',()=>notebook.open());
  $('setup-open').addEventListener('click',()=>{renderSetup();if(!campaignMode){const box=document.createElement('div'),heading=document.createElement('h3');heading.textContent='Practise with equipment';box.append(heading);for(const d of Object.values(window.CWWeapons.definitions)){const button=document.createElement('button');button.textContent='Practise: '+d.name;button.dataset.practiceWeapon=d.id;box.append(button);}const rescue=document.createElement('button');rescue.textContent='Practise: coffee rescue';rescue.onclick=()=>{restart('hybrid');state.actors[2].hp=0;state.actors[2].status='incapacitated';state.actors[2].y=4;state.supplies={schema:1,coffee:1,revived:[]};menu='kit';setup.close();render();};box.append(rescue);const note=document.createElement('p');note.textContent='Practice supplies are free and do not change your campaign equipment.';box.append(note);$('setup-content').append(box);}setup.showModal();});
  $('setup-close').addEventListener('click',()=>{setup.close();$('setup-open').focus({preventScroll:true});});
  $('setup-content').addEventListener('click',e=>{const weapon=e.target.closest('[data-practice-weapon]');if(weapon&&!campaignMode){setup.close();restart('hybrid');const d=window.CWWeapons.get(weapon.dataset.practiceWeapon),a=state.actors.find(a=>a.id==='officer');Object.assign(a,{weaponProfile:d.id,weapon:d.id,weaponName:d.name,bolts:6,loaded:false});render();return;}const c=e.target.closest('[data-case]'),m=e.target.closest('[data-mode]');if(c||m||e.target.closest('#reset')){setup.close();restart(m?m.dataset.mode:state.mode,c?c.dataset.case:P.info(state).id);}});
  canvas.addEventListener('click',e=>{
    if(state.phase!=='battle'||book.open||setup.open)return;
    const rect=canvas.getBoundingClientRect(),sx=e.clientX-rect.left,sy=e.clientY-rect.top;
    const tile=state.mode==='classic'||(!showMoves&&state.mode!=='grid')?null:I.pickStep(C.reachable(state),sx,sy,rect.width,rect.height);
    if(tile){perform(()=>C.move(state,tile.x,tile.y),false,{type:'move'});return;}
    const x=(sx-view.x)/view.scale,y=(sy-view.y)/view.scale;
    const foe=state.actors.filter(a=>a.team==='opposition'&&!['released','escaped'].includes(a.status)).find(a=>{const p=position(a);return Math.abs(x-p.x)<40&&y<p.y+15&&y>p.y-110;});
    if(foe){target=foe.id;clearTimeout(quipTimer);remark='';error='';notice='';if(C.resolution(state,target).surrendered){menu='talk';showMoves=false;}render();return;}
    if(state.mode!=='classic'){if(state.budget.move&&!showMoves)setMenu('move',false);showReport({summary:state.budget.move?'Tap a highlighted space':'No moves left',detail:state.budget.move?'Each highlighted space costs one move. The Move tab also has four direct arrows.':'Take your action or End turn. Movement returns on the officer’s next turn.',tone:'info'});}
  });
  document.addEventListener('keydown',e=>{
    if(book.open||setup.open)return;
    if(e.key==='Escape'&&menu!=='fight'){setMenu('fight');return;}
    if(state.phase!=='battle'||state.mode==='classic'||e.altKey||e.metaKey||e.ctrlKey)return;
    const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
    if(dirs[e.key]){e.preventDefault();const [dx,dy]=dirs[e.key];perform(()=>C.move(state,active().x+dx,active().y+dy),false,{type:'move'});}
  });
  Promise.all(Object.entries(ASSETS).map(([key,src])=>new Promise(resolve=>{const im=new Image();im.onload=()=>{images[key]=im;resolve();};im.onerror=()=>{error='A scene asset could not be loaded.';resolve();};im.src=src;}))).then(()=>{canvas.dataset.assetsLoaded=String(Object.keys(images).length);canvas.dataset.assetErrors=String(Object.keys(ASSETS).length-Object.keys(images).length);render();});
  new ResizeObserver(draw).observe(canvas.parentElement);
  if(!campaignMode)showReport({summary:P.info(state).title,detail:P.info(state).goal+' Accomplice attempts escape from round '+state.fleeRound+'.',tone:'info'});

  if(campaignMode){
    $('setup-open').hidden=true;
    document.querySelector('.cw-training-return').onclick=e=>{e.preventDefault();parent.postMessage({type:'cw-p21-battle-state',encounterId:campaignContext?.pending.id,battle:C.clone(state)},location.origin);parent.postMessage({type:'cw-p21-battle-exit',encounterId:campaignContext?.pending.id},location.origin);};
    $('return').textContent='Record outcome & return to city';
    window.addEventListener('message',e=>{
      if(e.origin!==location.origin||e.source!==parent)return;
      if(e.data?.type==='cw-p21-battle-save-failed'&&campaignContext&&e.data.encounterId===campaignContext.pending.id){error='The report could not be fully saved. Keep this encounter open and retry Record outcome.';render();return;}
      if(e.data?.type!=='cw-p21-battle-init'||campaignContext)return;
      const incoming=e.data;const old=incoming.pending.battle;
      if(old?.actors?.length&&['battle','result'].includes(old.phase))state=C.clone(old);
      else{const officer=state.actors.find(a=>a.id==='officer'),s=incoming.state;officer.hp=Math.max(1,Math.ceil(s.hp/s.maxhp*officer.maxHp));officer.campaignHpOffset=s.hp-Math.ceil(officer.hp/officer.maxHp*s.maxhp);if(s.flags.recruitName)officer.name=s.flags.recruitName;
        const binding=e.data.pending.binding;

        if(binding==='shift-disturbance')state.actors.find(a=>a.id==='patron').name='Aggressive patron';

        if(binding==='crypt-raider')state.actors.find(a=>a.id==='patron').name='Crypt raider';
        if(/^cutpurse/.test(binding))state.actors.find(a=>a.id==='patron').name='Reported assault suspect';
        window.CWOpponents.bind(state,incoming.pending,incoming.record);
      }
      window.CWOpeningSuspect.bindBattle(state,incoming.pending.binding,incoming.state.flags.p21PatrolRounds?.active?.enquiry?.variantId);
      try{window.CWPatrolPartner.bind(state,incoming.state,incoming.pending);window.CWWeapons.bind(state,incoming.state,incoming.pending);if(!old)delete state.supplies;window.CWSupplies.bind(state,incoming.state,incoming.pending);const captured=window.BastionLocations.copy(incoming.pending.location);if(captured)state.location=captured;
        if(!old&&window.QuillShopPreparations&&incoming.record){const bound=window.QuillShopPreparations.bind(incoming.record,state);if(bound.ok){state=bound.battle;parent.postMessage({type:'cw-p21-preparation-bind',encounterId:incoming.pending.id,expectedRevision:incoming.record.revision,record:bound.record},location.origin);}}
        campaignContext=incoming;}catch(e){parent.postMessage({type:'cw-p21-battle-load-error',encounterId:incoming.pending.id},location.origin);return;}
      const view=window.CWEncounterFeel.view(state,incidentInfo(state),state.result?incidentDebrief(state):null,campaignMode);
      if(old){
        const surrender=state.actors.find(a=>a.team==='opposition'&&a.status==='surrendered');
        if(state.phase==='battle'&&surrender){target=surrender.id;menu='talk';showMoves=false;}
        showReport({summary:state.phase==='result'?'Incident report restored':'Incident resumed',detail:[view.progress,view.danger].filter(Boolean).join(' · '),tone:'info'});
      }else{
        const p=window.CWChase.profile(incoming.pending.binding);
        showReport({summary:p?.fleeRound?'Watch the exits':incidentInfo(state).title,detail:p?.fleeRound?state.actors.find(a=>a.id===p.primary).name+' may attempt escape from round '+p.fleeRound+'. Catching an accomplice alone does not complete this assignment.':[view.goal,view.danger].filter(Boolean).join(' · '),tone:'info'});
      }
      parent.postMessage({type:'cw-p21-battle-state',encounterId:campaignContext?.pending.id,battle:C.clone(state)},location.origin);render();
      parent.postMessage({type:'cw-p21-battle-presented',encounterId:campaignContext.pending.id},location.origin);
    });
    parent.postMessage({type:'cw-p21-battle-ready'},location.origin);
  }
  bindPracticePartner();
  render();
})();
