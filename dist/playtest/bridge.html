<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Watch playtest</title>
<style>
 :root{color-scheme:light}
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1e2019;font:18px/1.45 Georgia,serif;color:#302318}
 main{box-sizing:border-box;width:min(92vw,460px);padding:28px 24px;background:#e8d5ad;border:2px solid #8a6a43;border-radius:4px;box-shadow:0 8px 30px #0008}
 h1{margin:0 0 12px;font-size:24px}
 p{margin:0 0 14px}
 button{display:block;width:100%;min-height:52px;margin-top:8px;border:0;border-radius:4px;background:#4a3321;color:#f6e5c4;font:600 18px Georgia,serif}
 #status{min-height:1.4em;color:#6b2f22}
</style>
</head>
<body>
<main>
 <h1>Playtest: The Bridge That Was Closed</h1>
 <p>This starts City Watch just before the Bridge case: the first case done, both partners available, full health.</p>
 <p><strong>It replaces any City Watch progress saved in this browser.</strong></p>
 <button id="start" type="button">Start the playtest</button>
 <p id="status" role="status"></p>
</main>
<script>
/* Loads the prepared save (bridge-start.json, format city-watch-save) into this browser's
   City Watch storage, then opens the game. A page of its own, so no cached copy of the
   game's front page can skip it. */
document.getElementById('start').addEventListener('click', async () => {
  const status = document.getElementById('status'), button = document.getElementById('start');
  button.disabled = true; status.textContent = 'Loading the playtest save…';
  try {
    const file = await (await fetch('bridge-start.json?v=' + Date.now(), {cache: 'no-store'})).json();
    const entries = file && file.format === 'city-watch-save' && file.data ? Object.entries(file.data).filter(([k, v]) => k.startsWith('city_watch_') && typeof v === 'string') : [];
    if (!entries.length) throw Error('empty save');
    const old = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('city_watch_')) old.push(k); }
    for (const k of old) localStorage.removeItem(k);
    for (const [k, v] of entries) localStorage.setItem(k, v);
    status.textContent = 'Opening the game…';
    location.replace('../index.html?fresh=' + Date.now());
  } catch (e) {
    button.disabled = false; status.textContent = 'The playtest save could not be loaded. Check your connection and try again.';
  }
});
</script>
</body>
</html>
