<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final four landmark review</title>
<style>body{margin:0;background:#202626;color:#eee;font:16px system-ui}header{padding:16px;position:sticky;top:0;background:#202626;z-index:2}button,select,input{font:inherit;margin:5px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;padding:12px}.card{border:1px solid #888;padding:12px}.stage{height:650px;position:relative;overflow:auto;background:#ddd}.stage img{position:absolute;left:50%;bottom:10px;transform:translateX(-50%)}.scale{position:absolute;left:15px;bottom:10px;height:60px;border-left:3px solid #a35d08;color:#a35d08;font-size:12px}.cobbles{background:repeating-conic-gradient(#78736b 0 25%,#68635c 0 50%) 0/28px 14px}</style>
<header><strong>Final four: proposed art review</strong><br>Background <select id="bg"><option value="pale">Pale</option><option value="dark">Dark</option><option value="cobbles">Cobbles</option></select>Layer <select id="layer"><option value="full">Full</option><option value="walls">Walls</option><option value="roof">Roof</option><option value="emission">Emission</option></select>Night blend <input id="blend" type="range" min="0" max="1" step=".01" value="0"><p>Shown at game scale, doors ~70 px. Asset preview only.</p></header><main></main>
<script>
const names=['bakery','shrine','alley','outpost'];let reg=[];
function update(){for(const [i,card]of [...document.querySelectorAll('.card')].entries()){const n=names[i],layer=document.querySelector('#layer').value,bg=document.querySelector('#bg').value;const stage=card.querySelector('.stage');stage.className='stage '+(bg==='cobbles'?'cobbles':'');stage.style.backgroundColor=bg==='dark'?'#101517':'#e4ded0';const suffix=layer==='full'?'day':layer,ns=layer==='full'?'night':layer+'-night';const imgs=card.querySelectorAll('img');imgs[0].src=`game2x/${n}-${suffix}.webp`;imgs[1].src=`game2x/${n}-${layer==='emission'?'emission':ns}.webp`;imgs[1].style.opacity=document.querySelector('#blend').value;for(const img of imgs)img.style.width=reg[i].game2x.dimensions[0]/2+'px';}}
fetch('registration.json').then(r=>r.json()).then(r=>{reg=r;document.querySelector('main').innerHTML=names.map(n=>`<section class="card"><h2>${n}</h2><div class="stage"><img alt="${n} day layer"><img alt="${n} night layer"><span class="scale">60px officer</span></div></section>`).join('');update();});for(const id of ['bg','layer','blend'])document.getElementById(id).addEventListener('input',update);
</script></html>
