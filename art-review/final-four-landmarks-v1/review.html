<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Watch — Four landmark art review</title><style>
*{box-sizing:border-box}body{margin:0;background:#201d19;color:#f1e9d8;font:16px system-ui}header{padding:18px;position:sticky;top:0;background:#201d19;z-index:2;border-bottom:1px solid #82714d}h1{font-size:21px;margin:0 0 10px}label{display:inline-block;margin:5px 18px 5px 0}select,input{font:inherit}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:16px}article{border:1px solid #82714d;border-radius:6px;overflow:hidden}h2{font-size:18px;margin:12px}.stage{height:550px;position:relative;overflow:auto;background:#6a6458;background-image:linear-gradient(30deg,#575248 12%,transparent 12.5%,transparent 87%,#575248 87.5%),linear-gradient(150deg,#81796a 12%,transparent 12.5%,transparent 87%,#81796a 87.5%);background-size:28px 14px}.sprite{position:absolute;bottom:40px;left:80px;height:auto;max-width:none}.officer{position:absolute;left:15px;bottom:40px;width:22px;height:60px}.bracket{position:absolute;bottom:40px;left:43px;height:70px;border-left:2px solid #f2dc6b;width:8px;border-top:2px solid #f2dc6b;border-bottom:2px solid #f2dc6b}.diamond{position:absolute;bottom:20px;left:20px;width:28px;height:14px}p{margin:12px;font-size:14px;line-height:1.5}button{font:inherit;padding:4px 12px}</style>
<header><h1>City Watch — Four landmark candidates</h1><label>Light <select id="light"><option value="day">Day</option><option value="night">Night</option></select></label><label>Background <select id="bg"><option value="cobbles">Cobbles</option><option value="#ffffff">White</option><option value="#000000">Black</option><option value="#6a6458">Grey</option></select></label><label>Draw scale <input id="scale" type="range" min="0.12" max="0.5" step="0.005" value="0.27"><output id="scaleVal">0.27</output></label><p>60px figure · 70px doorway bracket · 28×14px map diamond. Scale is adjustable review guidance, not an approved site fit. Day/night sources are not pixel-registered.</p></header><main id="cards"></main>
<script>
const names={bakery:'Bakery',shrine:'Wayside Shrine',alley:'Crooked Alley House',outpost:'Watch Outpost'};
const widths={bakery:1254,shrine:1136,alley:941,outpost:1122};
for(const [key,title] of Object.entries(names)){const card=document.createElement('article');card.innerHTML=`<h2>${title}</h2><div class="stage"><img class="sprite" data-name="${key}" alt="${title}" src="${key}-day.webp"><svg class="officer" viewBox="0 0 22 60" aria-label="60 pixel figure"><circle cx="11" cy="6" r="5" fill="#ebd8b5"/><path d="M6 13L16 13L20 36L15 36L16 60L11 60L10 39L8 60L3 60L5 36L1 36Z" fill="#afaa86"/></svg><span class="bracket" title="70px human door"></span><svg class="diamond" viewBox="0 0 28 14"><path d="M0 7L14 0L28 7L14 14Z" fill="none" stroke="#f2dc6b"/></svg></div><p><a href="${key}-day.png">Day source</a> · <a href="${key}-night.png">Night source</a></p>`;document.getElementById('cards').append(card)}
function update(){const mode=document.getElementById('light').value,bg=document.getElementById('bg').value,scale=Number(document.getElementById('scale').value);document.getElementById('scaleVal').value=scale.toFixed(3);for(const im of document.querySelectorAll('.sprite')){im.src=`${im.dataset.name}-${mode}.webp`;im.style.width=`${widths[im.dataset.name]*scale}px`}for(const st of document.querySelectorAll('.stage')){st.style.backgroundColor=bg==='cobbles'?'#6a6458':bg;st.style.backgroundImage=bg==='cobbles'?'':'none'}}
for(const el of document.querySelectorAll('select,input'))el.addEventListener('input',update);update();
</script></html>
