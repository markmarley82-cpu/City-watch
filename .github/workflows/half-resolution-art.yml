name: Generate separate half-resolution artwork
on:
  push:
    branches: [main]
    paths:
      - tools/generate-half-resolution-art.py
      - .github/workflows/half-resolution-art.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: half-resolution-art
  cancel-in-progress: false
jobs:
  reduce-art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image resizing dependency
        run: python -m pip install Pillow==13.0.0
      - name: Generate and verify separate artwork copies
        run: python tools/generate-half-resolution-art.py
      - name: Commit only the separate artwork folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- art-half-resolution/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified half-resolution artwork in separate folder [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
