name: Mended Drum source inspection
on:
  push:
    branches: [art/mended-drum-large-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Inspect source alpha and sampled geometry
        run: |
          python tools/inspect-mended-drum-large.py
          cat qa-results/mended-drum-large.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mended-drum-source-inspection
          path: qa-results/
