name: Deploy game to GitHub Pages

# Publishes the dist/ folder as the site root, so dist/index.html is served at
# https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish the game without the old play-*.html test pages and the
      # development source inventory (which lists Google Drive links).
      - name: Prepare site
        run: |
          mkdir _site
          cp -a dist/. _site/
          rm -f _site/play-*.html _site/source-inventory.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
