name: Deploy game to GitHub Pages

# Publishes the dist/ folder as the site root, so dist/index.html is served at
# https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish the game without the old play-*.html test pages and the
      # development source inventory (which lists Google Drive links).
      - name: Prepare site
        run: |
          mkdir _site
          cp -a dist/. _site/
          rm -f _site/play-*.html _site/source-inventory.json
          # Half-size paintings for phones (art-half-resolution/), only where the
          # original is unchanged; writes _site/half/ and _site/half/index.json.
          python3 -I tools/build-half-art.py dist art-half-resolution _site
      # Test build at <site>/next/: the newest work-in-progress branch, so changes can
      # be tried on a phone before they replace the live game. Same saves as live.
      - uses: actions/checkout@v4
        with:
          ref: claude/gallant-thompson-ii1f0c
          path: next-src
      - name: Prepare test build
        continue-on-error: true
        run: |
          mkdir -p _site/next
          cp -a next-src/dist/. _site/next/
          rm -f _site/next/play-*.html _site/next/source-inventory.json
          python3 -I next-src/tools/build-half-art.py next-src/dist next-src/art-half-resolution _site/next
      # Boot the game once in a headless phone browser to bake startup-cache.json
      # (expensive startup checks, verified for this exact build) and a fresh
      # cw-prefetch-list.json. See tools/bake-startup-cache.js. Optional: if it
      # fails, the site still deploys and phones simply run the checks themselves.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bake startup files
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node tools/bake-startup-cache.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for this attempt's Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          for attempt in range(12):
              with urllib.request.urlopen(request) as response:
                  artifacts = json.load(response)['artifacts']
              if any(a['name'] == os.environ['PAGES_ARTIFACT'] for a in artifacts):
                  print('Current Pages artifact is available.')
                  break
              time.sleep(5)
          else:
              raise SystemExit('Current Pages artifact did not become available.')
          PY
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # Last lines of the log: what the bake produced (the upload step lists
      # every file, which buries the bake's own output).
      - name: Report baked startup files
        if: always()
        run: |
          echo "startup-cache.json: $(head -c 300 _site/startup-cache.json)"
          node -e "const l=require('./_site/cw-prefetch-list.json');console.log('cw-prefetch-list.json:',l.files.length,'files ·',l.note)"
