name: Shop room readability checks
on:
  push:
    branches: [fix/shop-room-readability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/shop-qa" --no-audit --no-fund playwright@1.63.0
      - run: '"$RUNNER_TEMP/shop-qa/node_modules/.bin/playwright" install --with-deps chromium'
      - run: node tools/test-shop-room-readability.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/shop-qa/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-room-phone-review
          path: qa-results/shop-rooms/
