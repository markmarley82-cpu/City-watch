name: Portrait review checks
on:
  push:
    branches: [art/integrate-named-portraits-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portrait-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated QA dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/cw-portrait-qa" --no-audit --no-fund playwright@1.63.0 happy-dom@21.0.4
          "$RUNNER_TEMP/cw-portrait-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Identity and dialogue checks
        env:
          CW_QA_DOM_MODULE: ${{ runner.temp }}/cw-portrait-qa/node_modules/happy-dom/lib/index.js
        run: |
          node tests/cw-conversation-portraits.mjs
          node tests/cw-conversation-portraits-dom.mjs
          node tests/cw-nc01-bridge-pilot.mjs
          node tests/cw-city-cases-data.mjs
      - name: Chromium dialogue and startup checks
        env:
          NODE_PATH: ${{ runner.temp }}/cw-portrait-qa/node_modules
        run: node tools/test-portrait-browser.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portrait-browser-review
          path: qa-results/
          if-no-files-found: warn
